<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>cut 批量剪辑</title><style>body{font:16px system-ui;background:#f5f6fa;color:#182033;max-width:900px;margin:40px auto;padding:20px}section{background:white;border-radius:16px;padding:24px;margin:20px 0}label{display:block;margin:15px 0}textarea,select,button,input{font:inherit;padding:8px}button{cursor:pointer}article{border-top:1px solid #ddd;padding:16px 0;overflow-wrap:anywhere}#message{white-space:pre-wrap}small{color:#657086}</style>
<h1>cut · 信息流剪辑工作台</h1><p>规则剪辑或 AI 规划，按商品类别批量输出带字幕的竖屏 MP4。</p>
<section><h2>1. 素材</h2><label>类别 <input id="category" value="general" maxlength="64"></label><input id="files" type="file" accept="video/*" multiple><button id="upload">上传</button><div id="assets"></div></section>
<section><h2>2. 生成</h2><p id="aiStatus"></p>
<label>剪辑规划 <select id="planner"><option value="rules">本地规则（无需模型）</option><option value="chat">AI 规划（需配置模型）</option></select></label>
<label>商品说明与素材描述 <textarea id="brief" maxlength="2000" rows="4" style="width:95%" placeholder="例如：紫金鼠素串，焦糖棕色；文件 closeup.mp4 是珠子特写。仅填写真实卖点。"></textarea></label>
<label>字幕 <select id="subtitleMode"><option value="none">不添加</option><option value="manual">手写字幕</option><option value="ai">AI 生成文案字幕</option></select></label>
<label>手写字幕（每行一句，每句最多48字，按成片总时长均分）<textarea id="subtitleLines" rows="4" style="width:95%" placeholder="腕间的一抹焦糖棕&#10;简单搭配，也很耐看"></textarea></label>
<p><small>AI 会发送商品说明、素材文件名和时长到你配置的模型；不上传视频，不做语音识别。生成字幕请在任务详情中核对。</small></p><label>声音 <select id="audioMode"><option value="none">无声音（旧模式）</option><option value="tts_bgm">AI 配音＋背景音乐</option></select></label>
<label>上传背景音乐 <input id="musicFile" type="file" accept="audio/*"><button id="uploadMusic" type="button">上传音乐</button></label>
<label>选择已上传音乐 <select id="music"><option value="">请上传音乐</option></select></label>
<label>配乐音量（0–50%，默认12%）<input id="musicVolume" type="number" min="0" max="50" value="12"></label>
<p><small>配音朗读字幕文案并逐句对齐；音乐自动循环、压低音量并淡出。配音使用单独的千问 TTS 配置，可能产生费用；请上传有权使用的音乐。</small></p>
<label>条数 <input id="count" type="number" min="1" max="20" value="10"></label><label>成片秒数 <input id="duration" type="number" min="1" max="60" value="15"></label><label>镜头秒数 <input id="clip" type="number" min="1" max="10" value="3"></label><button id="generate">批量生成</button><p>720×1280 / 30fps / H.264 / 可选配音＋配乐。素材不足会重复，不保证变体唯一。</p><p id="message" role="status"></p></section>
<section><h2>3. 最近任务</h2><small>需要另开终端运行 Worker；每两秒刷新。</small><div id="jobs"></div></section>
<script>
const $=id=>document.getElementById(id);let assets=[],selected=new Set();const msg=s=>$('message').textContent=s;
async function api(url,options){const r=await fetch(url,options),d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
async function load(){assets=await api('/api/assets');$('assets').replaceChildren();for(const a of assets.filter(a=>a.category===$('category').value.trim())){const l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.checked=selected.has(a.id);i.onchange=()=>i.checked?selected.add(a.id):selected.delete(a.id);l.append(i,document.createTextNode(`${a.name} · ${a.duration.toFixed(1)} 秒`));$('assets').append(l)}}
$('category').onchange=()=>{selected.clear();load().catch(e=>msg(e.message))};
$('upload').onclick=async()=>{$('upload').disabled=true;try{if(!$('files').files.length)throw Error('请先选择视频');for(const f of $('files').files){msg('上传并校验 '+f.name);const a=await api('/api/assets?name='+encodeURIComponent(f.name)+'&category='+encodeURIComponent($('category').value.trim()),{method:'POST',body:f});selected.add(a.id)}await load();msg('上传完成')}catch(e){msg(e.message)}finally{$('upload').disabled=false}};
$('generate').onclick=async()=>{$('generate').disabled=true;try{const d=await api('/api/batches',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({audio_mode:$('audioMode').value,music_id:$('music').value,music_volume:Number($('musicVolume').value)/100,asset_ids:assets.filter(a=>a.category===$('category').value.trim()&&selected.has(a.id)).map(a=>a.id),category:$('category').value.trim(),planner:$('planner').value,subtitle_mode:$('subtitleMode').value,product_brief:$('brief').value,subtitle_lines:$('subtitleLines').value.split('\n').map(x=>x.trim()).filter(Boolean),count:Number($('count').value),duration:Number($('duration').value),clip_seconds:Number($('clip').value)})});msg('已创建批次 '+d.batch_id);await jobs()}catch(e){msg(e.message)}finally{$('generate').disabled=false}};
async function jobs(){const rows=await api('/api/jobs');$('jobs').replaceChildren();for(const j of rows){const el=document.createElement('article'),p=document.createElement('p'),bar=document.createElement('progress');p.textContent=`${j.request.category} · ${j.id.slice(0,8)} · ${j.status} · 尝试 ${j.attempts} 次`;bar.max=100;bar.value=j.progress;el.append(p,bar);if(j.download_url){const a=document.createElement('a');a.href=j.download_url;a.textContent=' 下载 MP4';el.append(a)}if(j.subtitles_url){const a=document.createElement('a');a.href=j.subtitles_url;a.textContent=' 下载 SRT';el.append(a)}if(j.plan){const details=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');summary.textContent='查看镜头与字幕';pre.style.whiteSpace='pre-wrap';pre.textContent=JSON.stringify(j.plan,null,2);details.append(summary,pre);el.append(details)}if(j.error){const e=document.createElement('p');e.textContent=j.error;el.append(e)}if(j.status==='failed'){const b=document.createElement('button');b.textContent='重试';b.onclick=async()=>{try{await api('/api/jobs/'+j.id+'/retry',{method:'POST',body:'{}'});await jobs()}catch(e){msg(e.message)}};el.append(b)}$('jobs').append(el)}}
async function loadMusic(chosen){const items=await api('/api/music');$('music').replaceChildren();const empty=document.createElement('option');empty.value='';empty.textContent='请选择背景音乐';$('music').append(empty);for(const m of items){const option=document.createElement('option');option.value=m.id;option.textContent=m.name;$('music').append(option)}if(chosen)$('music').value=chosen}
$('uploadMusic').onclick=async()=>{$('uploadMusic').disabled=true;try{const f=$('musicFile').files[0];if(!f)throw Error('请先选择音频文件');msg('上传音乐中');const m=await api('/api/music?name='+encodeURIComponent(f.name),{method:'POST',body:f});await loadMusic(m.id);msg('音乐上传完成')}catch(e){msg(e.message)}finally{$('uploadMusic').disabled=false}};
$('audioMode').onchange=()=>{if($('audioMode').value==='tts_bgm'&&$('subtitleMode').value==='none')$('subtitleMode').value='manual'};
loadMusic().catch(e=>msg(e.message));$('subtitleMode').onchange=()=>{if($('subtitleMode').value==='ai')$('planner').value='chat'};api('/api/health').then(h=>{$('aiStatus').textContent=h.ai_configured?'已填写模型配置（连接可用性在任务执行时验证）':'模型尚未配置；可先用规则剪辑 + 手写字幕';$('planner').value=h.default_planner}).catch(e=>msg(e.message));load().catch(e=>msg(e.message));jobs().catch(e=>msg(e.message));setInterval(()=>jobs().catch(e=>msg(e.message)),2000);
</script></html>
