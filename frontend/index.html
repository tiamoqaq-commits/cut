<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>cut 批量剪辑</title><style>body{font:16px system-ui;background:#f5f6fa;color:#182033;max-width:900px;margin:40px auto;padding:20px}section{background:white;border-radius:16px;padding:24px;margin:20px 0}label{display:block;margin:15px 0}button,input{font:inherit;padding:8px}button{cursor:pointer}article{border-top:1px solid #ddd;padding:16px 0;overflow-wrap:anywhere}#message{white-space:pre-wrap}small{color:#657086}</style>
<h1>cut · 信息流剪辑工作台</h1><p>本地规则剪辑，无需模型密钥。按商品类别批量输出竖屏 MP4。</p>
<section><h2>1. 素材</h2><label>类别 <input id="category" value="general" maxlength="64"></label><input id="files" type="file" accept="video/*" multiple><button id="upload">上传</button><div id="assets"></div></section>
<section><h2>2. 生成</h2><label>条数 <input id="count" type="number" min="1" max="20" value="10"></label><label>成片秒数 <input id="duration" type="number" min="1" max="60" value="15"></label><label>镜头秒数 <input id="clip" type="number" min="1" max="10" value="3"></label><button id="generate">批量生成</button><p>720×1280 / 30fps / H.264 / 无音轨。素材不足会重复，不保证变体唯一。</p><p id="message" role="status"></p></section>
<section><h2>3. 最近任务</h2><small>需要另开终端运行 Worker；每两秒刷新。</small><div id="jobs"></div></section>
<script>
const $=id=>document.getElementById(id);let assets=[],selected=new Set();const msg=s=>$('message').textContent=s;
async function api(url,options){const r=await fetch(url,options),d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
async function load(){assets=await api('/api/assets');$('assets').replaceChildren();for(const a of assets.filter(a=>a.category===$('category').value.trim())){const l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.checked=selected.has(a.id);i.onchange=()=>i.checked?selected.add(a.id):selected.delete(a.id);l.append(i,document.createTextNode(`${a.name} · ${a.duration.toFixed(1)} 秒`));$('assets').append(l)}}
$('category').onchange=()=>{selected.clear();load().catch(e=>msg(e.message))};
$('upload').onclick=async()=>{$('upload').disabled=true;try{if(!$('files').files.length)throw Error('请先选择视频');for(const f of $('files').files){msg('上传并校验 '+f.name);const a=await api('/api/assets?name='+encodeURIComponent(f.name)+'&category='+encodeURIComponent($('category').value.trim()),{method:'POST',body:f});selected.add(a.id)}await load();msg('上传完成')}catch(e){msg(e.message)}finally{$('upload').disabled=false}};
$('generate').onclick=async()=>{$('generate').disabled=true;try{const d=await api('/api/batches',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({asset_ids:assets.filter(a=>a.category===$('category').value.trim()&&selected.has(a.id)).map(a=>a.id),category:$('category').value.trim(),count:Number($('count').value),duration:Number($('duration').value),clip_seconds:Number($('clip').value)})});msg('已创建批次 '+d.batch_id);await jobs()}catch(e){msg(e.message)}finally{$('generate').disabled=false}};
async function jobs(){const rows=await api('/api/jobs');$('jobs').replaceChildren();for(const j of rows){const el=document.createElement('article'),p=document.createElement('p'),bar=document.createElement('progress');p.textContent=`${j.request.category} · ${j.id.slice(0,8)} · ${j.status} · 尝试 ${j.attempts} 次`;bar.max=100;bar.value=j.progress;el.append(p,bar);if(j.download_url){const a=document.createElement('a');a.href=j.download_url;a.textContent=' 下载 MP4';el.append(a)}if(j.error){const e=document.createElement('p');e.textContent=j.error;el.append(e)}if(j.status==='failed'){const b=document.createElement('button');b.textContent='重试';b.onclick=async()=>{try{await api('/api/jobs/'+j.id+'/retry',{method:'POST',body:'{}'});await jobs()}catch(e){msg(e.message)}};el.append(b)}$('jobs').append(el)}}
load().catch(e=>msg(e.message));jobs().catch(e=>msg(e.message));setInterval(()=>jobs().catch(e=>msg(e.message)),2000);
</script></html>
